name: refresh

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub turns off a schedule after 60 days without a commit.
      # Turning it on again from here resets that clock, so the page keeps
      # refreshing after the code is frozen.
      - name: Keep the daily schedule on
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m llmledger.pipeline
        env:
          PYTHONPATH: src
      # The pipeline checks every outside source's licence and writes any
      # problem to this file. Open one issue about it (not one a day).
      - name: Report licence problems
        if: always()
        run: |
          [ -f data/licence-problems.txt ] || exit 0
          open=$(gh issue list --state open --search "Licence check in:title" --json number --jq length)
          [ "$open" = "0" ] || exit 0
          gh issue create --title "Licence check: an outside source changed" --body-file data/licence-problems.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
