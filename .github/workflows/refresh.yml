name: refresh

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub turns off a schedule after 60 days without a commit.
      # Turning it on again from here resets that clock, so the page keeps
      # refreshing after the code is frozen.
      - name: Keep the daily schedule on
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m llmledger.pipeline
        env:
          PYTHONPATH: src
      # The pipeline checks every outside source's licence, writes the report
      # to data/licences.json and any problem to data/licence-problems.txt.
      # Open one issue about a problem (not one a day), and close it on the
      # first run whose check finds nothing.
      - name: Report licence problems
        if: always()
        run: |
          [ -f data/licences.json ] || exit 0
          open=$(gh issue list --state open --search "Licence check in:title" --json number --jq '.[].number')
          if [ ! -f data/licence-problems.txt ]; then
            for n in $open; do
              gh issue close "$n" --comment "Fixed: today's licence check found no problem. $RUN"
            done
          elif [ -z "$open" ]; then
            title="Licence check: an outside source changed"
            grep -qv "could not be checked today" data/licence-problems.txt || title="Licence check: a source could not be read"
            gh issue create --title "$title" --body-file data/licence-problems.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # A failed refresh publishes nothing, so the live page keeps the last good data (and says so after
  # 3 days). Open one issue about it, and close it when a refresh is published again.
  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Open or close the failed refresh issue
        run: |
          open=$(gh issue list --state open --search "Daily refresh failed in:title" --json number --jq '.[].number')
          if [ "$BUILD" = "success" ] && [ "$DEPLOY" = "success" ]; then
            for n in $open; do
              gh issue close "$n" --comment "Fixed: this refresh passed and was published. $RUN"
            done
          elif [ -z "$open" ]; then
            gh issue create --title "Daily refresh failed" \
              --body "The refresh of $(date -u +%F) did not publish (build: $BUILD, deploy: $DEPLOY), so the page keeps the last good data. Run log: $RUN"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
