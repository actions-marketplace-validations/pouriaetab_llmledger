name: plug-in

# Tests the plug-in (mcp/) on every pull request that touches it, and publishes it to PyPI
# when a tag like mcp-v0.1.0 is pushed. PyPI trusted publishing: no token is stored here.
# A tag, not a GitHub release, so Zenodo does not archive plug-in versions as llmledger versions.
on:
  pull_request:
    paths: ["mcp/**"]
  push:
    branches: [main]
    paths: ["mcp/**"]
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - run: uv venv --python 3.12
      - run: uv pip install -e . pytest==9.1.1
      - run: .venv/bin/python -m pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - name: The tag matches the version in pyproject.toml
        run: test "mcp-v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" = "${GITHUB_REF_NAME}"
      - name: Bundle today's data
        run: python3 scripts/snapshot.py
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: mcp/dist
